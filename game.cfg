; Per-game values. This is the only file you edit to rebrand the template.
; Every make target runs `tools/apply_config.gd`, which copies these values
; into project.godot and export_presets.cfg. Do not edit them there.

[app]

name="Template Hop"
; Reverse-domain id. Never change it after the first store upload.
package="com.example.hop"
; version_code must go up by 1 for every store upload.
version_code=1
version_name="0.1.0"
; portrait | landscape | sensor_portrait | sensor_landscape | sensor
orientation="portrait"

[game]

; Scene that holds the actual game. Its root must emit `finished(score: int)`
; and have `start(rng_seed: int)`. See games/hop/hop.gd.
scene="res://games/hop/hop.tscn"

[ads]

; Master switch. false = the AdMob plugin is left out of the build entirely
; (no SDK, no AD_ID permission, no iOS frameworks) and AdService does nothing.
; Turning ads on changes the Play Data safety form and the privacy policy.
enabled=false
; Show an interstitial after every N finished runs (0 = never).
interstitial_every_n_runs=3
; AdMob IDs. These are Google's official SAMPLE/TEST ids
; (developers.google.com/admob/android/test-ads, /ios/test-ads).
; Put your real ids in only when you release; never commit them earlier.
android_app_id="ca-app-pub-3940256099942544~3347511713"
android_interstitial="ca-app-pub-3940256099942544/1033173712"
android_rewarded="ca-app-pub-3940256099942544/5224354917"
ios_app_id="ca-app-pub-3940256099942544~1458002511"
ios_interstitial="ca-app-pub-3940256099942544/4411468910"
ios_rewarded="ca-app-pub-3940256099942544/1712485313"
; Debug builds only: pretend the device is in the EEA so the consent form shows.
debug_consent_eea=true
; Debug builds only: comma-separated hashed device ids for the consent debug
; settings (the UMP SDK prints the id in logcat on first run).
test_device_hashed_ids=""

[iap]

; Master switch. false = the Play Billing plugin is left out of the build
; (no billing library, no BILLING permission) and the store buttons are hidden.
enabled=false
remove_ads_product_id="remove_ads"

[feedback]
; Settings "Send feedback" opens this URL (empty = no button). {version} and
; {device} (also percent-encoded, as Google Forms pre-filled links store them)
; are filled in for a form's prefill fields.
url=""
